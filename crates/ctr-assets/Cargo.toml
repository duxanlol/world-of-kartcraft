[package]
name = "ctr-assets"
version.workspace = true
edition.workspace = true
# Ports format logic from CTR-tools (GPL-2.0) and CTR-native (GPL-3.0); see src/lib.rs.
license = "GPL-3.0-or-later"
description = "Converts the user's own Crash Team Racing (NTSC-U) disc image into a kart asset (kart.json)"

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
# PNG writer for the `render_kart` example (visual verification only).
png = "0.18.1"

[[bin]]
name = "ctr-extract"
path = "src/bin/ctr-extract.rs"
