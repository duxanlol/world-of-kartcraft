# Builds the game server's image and the clients (Windows, Mac and Linux) from the branch it is
# started on (the staging branch, by deploy-staging.sh or Actions → "Release" → Run workflow) and
# publishes the clients to the testers. It runs only when started by hand.
#
# Each platform is built once and packaged twice, with the same version: for staging (its launcher
# and presets name the staging server; uploaded to the website's staging/ folder, live at once) and
# for production (the players' launcher and presets; uploaded to candidate/, where nothing looks).
# dist/promote.sh later copies candidate/ to the players' folders, so the players get the very
# files the testers had and promotion builds nothing.
#
# Settings (Settings → Secrets and variables → Actions):
#   variables  KARTCRAFT_SERVER, KARTCRAFT_UPDATE_URL, KARTCRAFT_REGISTER_URL — production's
#              presets (.setup/publish.cfg on the maintainer's machine);
#              KARTCRAFT_STAGING_SERVER, KARTCRAFT_STAGING_UPDATE_URL, KARTCRAFT_STAGING_REGISTER_URL
#              — staging's (.setup/publish-staging.cfg);
#              AZURE_STORAGE — the storage account whose $web container is the website.
#   secret     AZURE_STORAGE_KEY — that account's key. Without AZURE_STORAGE nothing is uploaded and
#              the packages are only the run's artifacts.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
    steps:
      - id: stamp
        run: echo "version=$(TZ=Europe/Vienna date +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"

  # The game server's image, built from kartcraft.patch (setup/vmangos/build-image.sh) and kept in
  # GitHub's registry, public: the staging VM pulls it, and promote.sh has production pull the very
  # same tag. Its tag is the patch's hash, so a release that leaves the server alone builds nothing.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      NAME: ghcr.io/duxanlol/world-of-kartcraft-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Already built?
        id: have
        run: |
          image="$NAME:5875-$(sha256sum setup/vmangos/kartcraft.patch | cut -c1-12)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "built=1" >> "$GITHUB_OUTPUT"
            echo "$image is in the registry already"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.have.outputs.built != '1'
        with:
          repository: mserajnik/vmangos-deploy
          ref: f0692574b7955e78d68fea39372e0045360ce5ee
          path: vmangos-deploy
          persist-credentials: false
      - name: Build
        if: steps.have.outputs.built != '1'
        run: |
          image="$(setup/vmangos/build-image.sh vmangos-deploy "$NAME" | tail -1)"
          [ "$image" = "${{ steps.have.outputs.image }}" ]
      - name: Push
        if: steps.have.outputs.built != '1'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ steps.have.outputs.image }}"
          docker logout ghcr.io

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install && rustc -V
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows
          workspaces: ". -> target-dist"
      - name: Presets
        shell: bash
        run: |
          mkdir -p .setup
          printf 'SERVER=%s\nUPDATE_URL=%s\nREGISTER_URL=%s\n' "${{ vars.KARTCRAFT_SERVER }}" "${{ vars.KARTCRAFT_UPDATE_URL }}" "${{ vars.KARTCRAFT_REGISTER_URL }}" > .setup/publish.cfg
          printf 'SERVER=%s\nUPDATE_URL=%s\nREGISTER_URL=%s\n' "${{ vars.KARTCRAFT_STAGING_SERVER }}" "${{ vars.KARTCRAFT_STAGING_UPDATE_URL }}" "${{ vars.KARTCRAFT_STAGING_REGISTER_URL }}" > .setup/publish-staging.cfg
      - name: Package for staging
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File dist\publish.ps1 -Channel staging -Version $env:VERSION
      - name: Package for production
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File dist\publish.ps1 -Channel production -NoBuild -Version $env:VERSION
      - name: Keep the packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: world-of-kartcraft-windows-${{ env.VERSION }}
          path: |
            dist/staging/WorldOfKartcraft.zip
            dist/WorldOfKartcraft.zip
          retention-days: 30
          if-no-files-found: error
      - name: Upload
        if: vars.AZURE_STORAGE != ''
        shell: bash
        env:
          ACCOUNT: ${{ vars.AZURE_STORAGE }}
          KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          WEB: ${{ vars.KARTCRAFT_UPDATE_URL }}
        run: |
          dist/upload.sh dist/updates candidate/ "dist/WorldOfKartcraft/Kartcraft Launcher.exe" candidate/KartcraftLauncher.exe
          dist/upload.sh dist/staging/updates staging/ "dist/staging/WorldOfKartcraft/Kartcraft Launcher.exe" staging/KartcraftLauncher.exe

  macos:
    needs: version
    runs-on: macos-14
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install && rustup target add x86_64-apple-darwin && rustc -V
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-macos
          workspaces: ". -> target-dist"
      - name: Presets
        run: |
          mkdir -p .setup
          printf 'SERVER=%s\nUPDATE_URL=%s\nREGISTER_URL=%s\n' "${{ vars.KARTCRAFT_SERVER }}" "${{ vars.KARTCRAFT_UPDATE_URL }}" "${{ vars.KARTCRAFT_REGISTER_URL }}" > .setup/production.cfg
          printf 'SERVER=%s\nUPDATE_URL=%s\nREGISTER_URL=%s\nCHANNEL=staging\n' "${{ vars.KARTCRAFT_STAGING_SERVER }}" "${{ vars.KARTCRAFT_STAGING_UPDATE_URL }}" "${{ vars.KARTCRAFT_STAGING_REGISTER_URL }}" > .setup/staging.cfg
      - name: Package for staging
        run: PUBLISH_CFG=.setup/staging.cfg KARTCRAFT_OUT=dist/macos/out/staging dist/macos/package.sh
      - name: Package for production
        run: PUBLISH_CFG=.setup/production.cfg dist/macos/package.sh --launcher-only
      - name: Keep the packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: world-of-kartcraft-macos-${{ env.VERSION }}
          path: |
            dist/macos/out/staging/World of Kartcraft.zip
            dist/macos/out/World of Kartcraft.zip
          retention-days: 30
          if-no-files-found: error
      - name: Upload
        if: vars.AZURE_STORAGE != ''
        env:
          ACCOUNT: ${{ vars.AZURE_STORAGE }}
          KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          WEB: ${{ vars.KARTCRAFT_UPDATE_URL }}
        run: |
          dist/upload.sh dist/macos/out/updates candidate/macos/ "dist/macos/out/World of Kartcraft.zip" "candidate/macos/World of Kartcraft.zip"
          dist/upload.sh dist/macos/out/staging/updates staging/macos/ "dist/macos/out/staging/World of Kartcraft.zip" "staging/macos/World of Kartcraft.zip"

  # The Linux launcher, an AppImage (the game a Linux player runs is the Windows one, through
  # Proton, from the Windows updates). Built in Debian 12, so it starts on Ubuntu 22.04 and newer.
  linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Presets
        run: |
          mkdir -p .setup
          printf 'SERVER=%s\nUPDATE_URL=%s\nREGISTER_URL=%s\n' "${{ vars.KARTCRAFT_SERVER }}" "${{ vars.KARTCRAFT_UPDATE_URL }}" "${{ vars.KARTCRAFT_REGISTER_URL }}" > .setup/production.cfg
          printf 'SERVER=%s\nUPDATE_URL=%s\nREGISTER_URL=%s\nCHANNEL=staging\n' "${{ vars.KARTCRAFT_STAGING_SERVER }}" "${{ vars.KARTCRAFT_STAGING_UPDATE_URL }}" "${{ vars.KARTCRAFT_STAGING_REGISTER_URL }}" > .setup/staging.cfg
      - name: Package for staging
        run: PUBLISH_CFG=.setup/staging.cfg KARTCRAFT_OUT=dist/linux/out/staging dist/appimage.sh
      - name: Package for production
        run: PUBLISH_CFG=.setup/production.cfg dist/appimage.sh
      # Why it is built in Debian 12: Ubuntu 22.04 has glibc 2.35.
      - name: glibc 2.35 at most
        run: |
          for image in "dist/linux/out/staging/Kartcraft Launcher.AppImage" "dist/linux/out/Kartcraft Launcher.AppImage"; do
            rm -rf "$RUNNER_TEMP/squashfs-root"
            (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$image" --appimage-extract >/dev/null)
            need=$(objdump -T "$RUNNER_TEMP/squashfs-root/usr/bin/kartcraft-launcher" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$image needs $need"
            [ "$(printf '%s\nGLIBC_2.35\n' "$need" | sort -V | tail -1)" = GLIBC_2.35 ]
          done
      - name: Keep the packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: world-of-kartcraft-linux-${{ env.VERSION }}
          path: |
            dist/linux/out/staging/Kartcraft Launcher.AppImage
            dist/linux/out/Kartcraft Launcher.AppImage
          retention-days: 30
          if-no-files-found: error
      - name: Upload
        if: vars.AZURE_STORAGE != ''
        env:
          ACCOUNT: ${{ vars.AZURE_STORAGE }}
          KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          WEB: ${{ vars.KARTCRAFT_UPDATE_URL }}
        run: |
          dist/upload.sh dist/linux/out/updates candidate/linux/ "dist/linux/out/Kartcraft Launcher.AppImage" "candidate/linux/Kartcraft Launcher.AppImage"
          dist/upload.sh dist/linux/out/staging/updates staging/linux/ "dist/linux/out/staging/Kartcraft Launcher.AppImage" "staging/linux/Kartcraft Launcher.AppImage"
