[package]
name = "kartcraft-launcher"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "World of Kartcraft's launcher for Windows and macOS: one program that installs, updates and starts the game"

[lints]
workspace = true

[build-dependencies]
# World of Kartcraft's icon into the Windows launcher (`benilla_buildstamp::windows_icon`).
benilla-buildstamp = { path = "../benilla-buildstamp" }

[[bin]]
name = "kartcraft-launcher"
path = "src/main.rs"

# Windows and macOS: on Linux and the Steam Deck the game runs through Proton with play-proton.sh.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.15"
ureq = "2"
sha2 = "0.10"
flate2 = "1"
serde_json = "1"
# The window's icon, the WoK badge (`dist/icon.png`).
image = { version = "0.25", default-features = false, features = ["png"] }
