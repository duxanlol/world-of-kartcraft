[package]
name = "course-gen"
version.workspace = true
edition.workspace = true
# Later stages drive `ctr-kart` (GPL-3.0, ported from the CTR decompilation), so GPL-3.0 as well.
license = "GPL-3.0-or-later"
description = "Kart course generation from a zone's terrain in the player's own 1.12.1 install: rasters and the road network"

[lints]
workspace = true

[features]
# Forwarded so the install lookup's project-folder fallback follows the build, as for every
# dependent of `benilla-formats`.
default = ["dev"]
dev = ["benilla-formats/dev"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
benilla-formats = { path = "../benilla-formats", default-features = false }
benilla-bytes = { path = "../benilla-bytes" }
benilla-m2 = { path = "../benilla-m2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.30"
# Test-drives generated courses over CTR's driving model.
kart-driver = { path = "../kart-driver" }
# The deliveries' GPS roads `course-gen gps` builds and checks.
kart-gps = { path = "../kart-gps" }
# PNG only, for the debug render.
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "course-gen"
path = "src/bin/course-gen.rs"
