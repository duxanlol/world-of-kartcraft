<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prop Catalog</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --line: #2b2f37; --row: #22252c;
    --text: #e6e6e6; --dim: #9aa0aa; --gold: #ffd100; --sel: #2d3440; --hover: #242830;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: 360px 1fr; overflow: hidden;
  }
  aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 2px; font-size: 17px; color: var(--gold); letter-spacing: .2px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  input[type=search] {
    width: 100%; padding: 8px 10px; border-radius: 6px; font: inherit;
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
  }
  input[type=search]:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 999px; cursor: pointer;
    color: var(--dim); background: transparent; border: 1px solid var(--line);
  }
  .chip:hover { color: var(--text); }
  .chip.on { color: #1a1a1a; background: var(--gold); border-color: var(--gold); }
  .chip .c { opacity: .7; margin-left: 4px; }
  #list { overflow: auto; flex: 1; min-height: 0; }
  .group {
    position: sticky; top: 0; z-index: 1; background: var(--panel); color: var(--gold);
    padding: 9px 16px 5px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--line);
  }
  .group .c { color: var(--dim); font-weight: 400; margin-left: 6px; }
  .item {
    display: flex; align-items: baseline; gap: 8px; padding: 6px 16px; cursor: pointer;
    border-bottom: 1px solid var(--row);
  }
  .item:hover { background: var(--hover); }
  .item.sel { background: var(--sel); box-shadow: inset 3px 0 var(--gold); }
  .item .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .s { color: var(--dim); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tag { font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 4px; }
  .tag.wow { background: #3b2f12; color: #ffd100; }
  .tag.ctr { background: #12303b; color: #6fd3ff; }
  .empty { color: var(--dim); padding: 20px 16px; }
  main { position: relative; min-width: 0; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .card {
    position: absolute; background: rgba(20, 22, 26, .88); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(4px);
  }
  #info { left: 12px; top: 12px; max-width: min(540px, calc(100% - 24px)); }
  #info h2 { margin: 0 0 3px; font-size: 16px; display: flex; gap: 8px; align-items: center; }
  #info .p { color: var(--dim); font-size: 12px; word-break: break-all; }
  #info dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0 0; font-size: 13px; }
  #info dt { color: var(--dim); }
  #info dd { margin: 0; font-variant-numeric: tabular-nums; }
  #tools { right: 12px; top: 12px; display: flex; gap: 6px; padding: 6px; }
  #tools button {
    font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
  }
  #tools button.on { border-color: var(--gold); color: var(--gold); }
  #legend { right: 12px; bottom: 12px; color: var(--dim); font-size: 12px; }
  #legend b { color: var(--text); font-weight: 600; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); pointer-events: none; }
  [hidden] { display: none !important; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: 45vh 55vh; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
</script>
</head>
<body>
<aside>
  <header>
    <h1>Prop Catalog</h1>
    <div class="sub" id="sub">Track editor object candidates</div>
    <input type="search" id="q" placeholder="Search names and paths" aria-label="Search">
    <div class="chips" id="sources"></div>
    <div class="chips" id="groups"></div>
  </header>
  <div id="list" role="listbox" aria-label="Objects"></div>
</aside>
<main>
  <canvas id="view"></canvas>
  <div id="status">Loading the catalog</div>
  <div class="card" id="info" hidden></div>
  <div class="card" id="tools">
    <button id="wire" type="button">Wireframe</button>
    <button id="refs" type="button" class="on">Scale refs</button>
    <button id="reset" type="button">Reset view</button>
  </div>
  <div class="card" id="legend">Grid: <b>1 yard</b> cells · refs: <b>person</b> 1.8 yd, <b>kart</b> 1.5 × 2.4 yd · ↑↓ to step</div>
</main>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (id) => document.getElementById(id);
const status = $('status');

// ── The scene ──────────────────────────────────────────────────────────────────────────────
const canvas = $('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e2128);
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 5000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x404050, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(30, 60, 40);
scene.add(sun);
let grid = null;
function setGrid(size) {
  if (grid) scene.remove(grid);
  const n = Math.max(10, Math.ceil(size / 10) * 10 + 10);
  grid = new THREE.GridHelper(n, n, 0x555c69, 0x30353f);
  scene.add(grid);
}

// The scale references: a person and a kart, beside the model.
const refs = new THREE.Group();
const refMat = new THREE.MeshLambertMaterial({ color: 0x7fb3ff, transparent: true, opacity: 0.45 });
const person = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 1.8, 16), refMat);
person.position.set(0, 0.9, 0);
const kart = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.7, 2.4), refMat);
kart.position.set(1.6, 0.35, 0);
refs.add(person, kart);
scene.add(refs);

let model = null;
let frame = { center: new THREE.Vector3(), radius: 5 };
function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1, r.height);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement);
resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

function frameView() {
  const { center, radius } = frame;
  const d = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.05;
  camera.position.copy(center).add(new THREE.Vector3(0.9, 0.6, 1.1).normalize().multiplyScalar(d));
  camera.near = Math.max(0.01, d / 500);
  camera.far = d * 50;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
}

// ── Models ─────────────────────────────────────────────────────────────────────────────────
const loader = new THREE.TextureLoader();
const textures = new Map();
function texture(url, crisp) {
  if (!textures.has(url)) {
    const t = loader.load(url);
    t.flipY = false;
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    if (crisp) t.magFilter = THREE.NearestFilter;
    textures.set(url, t);
  }
  return textures.get(url);
}

let wireframe = false;
async function show(entry) {
  status.textContent = 'Loading ' + entry.name;
  status.hidden = false;
  const parts = await (await fetch('models/' + entry.id + '.json')).json();
  if (current !== entry) return;
  if (model) {
    scene.remove(model);
    model.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
  }
  model = new THREE.Group();
  for (const p of parts) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(p.pos, 3));
    if (p.uv.length) g.setAttribute('uv', new THREE.Float32BufferAttribute(p.uv, 2));
    if (p.col.length) g.setAttribute('color', new THREE.Float32BufferAttribute(p.col, 4));
    g.setIndex(p.idx);
    g.computeVertexNormals();
    const m = new THREE.MeshLambertMaterial({
      map: p.tex ? texture(p.tex, entry.source === 'ctr') : null,
      color: p.tex ? 0xffffff : 0xb0b0b0,
      vertexColors: p.col.length > 0,
      side: p.two_sided ? THREE.DoubleSide : THREE.FrontSide,
      transparent: p.blend === 'blend',
      depthWrite: p.blend !== 'blend',
      alphaTest: p.blend === 'alpha' ? 0.5 : 0,
      wireframe,
    });
    model.add(new THREE.Mesh(g, m));
  }
  // Stood on the grid, centred on it.
  const box = new THREE.Box3().setFromObject(model);
  const c = box.getCenter(new THREE.Vector3());
  model.position.set(-c.x, -box.min.y, -c.z);
  scene.add(model);
  const size = box.getSize(new THREE.Vector3());
  refs.position.set(size.x / 2 + 1.2, 0, 0);
  const all = new THREE.Box3().setFromObject(model);
  if (refs.visible) all.union(new THREE.Box3().setFromObject(refs));
  frame = { center: all.getCenter(new THREE.Vector3()), radius: Math.max(1, all.getSize(new THREE.Vector3()).length() / 2) };
  setGrid(Math.max(size.x, size.z) + 6);
  frameView();
  status.hidden = true;
}

// ── The list ───────────────────────────────────────────────────────────────────────────────
const catalog = await (await fetch('catalog.json')).json();
const entries = catalog.entries;
const byId = new Map(entries.map((e) => [e.id, e]));
let source = 'all', group = 'all', query = '', current = null, shown = [];
const fmt = (v) => (v >= 10 ? v.toFixed(0) : v.toFixed(1));
const sizeText = (e) => e.size.map(fmt).join(' × ') + ' yd';
$('sub').textContent = `${entries.length} objects · ${entries.filter((e) => e.source === 'wow').length} WoW · ${entries.filter((e) => e.source === 'ctr').length} CTR`;

function chips(el, items, get, set) {
  el.replaceChildren(...items.map(([key, label, n]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (get() === key ? ' on' : '');
    b.innerHTML = `${label}<span class="c">${n}</span>`;
    b.onclick = () => { set(key); render(); };
    return b;
  }));
}

function matches(e) {
  return (source === 'all' || e.source === source)
    && (!query || (e.name + ' ' + e.path).toLowerCase().includes(query));
}

function render() {
  const base = entries.filter(matches);
  chips($('sources'), [['all', 'All', entries.filter((e) => (!query || (e.name + ' ' + e.path).toLowerCase().includes(query))).length],
    ['wow', 'WoW', entries.filter((e) => e.source === 'wow' && (!query || (e.name + ' ' + e.path).toLowerCase().includes(query))).length],
    ['ctr', 'CTR', entries.filter((e) => e.source === 'ctr' && (!query || (e.name + ' ' + e.path).toLowerCase().includes(query))).length]],
    () => source, (v) => { source = v; });
  chips($('groups'), [['all', 'All groups', base.length], ...catalog.groups.map((g) => [g, g, base.filter((e) => e.group === g).length])],
    () => group, (v) => { group = v; });
  const list = $('list');
  const frag = document.createDocumentFragment();
  shown = [];
  for (const g of catalog.groups) {
    if (group !== 'all' && group !== g) continue;
    const items = base.filter((e) => e.group === g);
    if (!items.length) continue;
    const h = document.createElement('div');
    h.className = 'group';
    h.innerHTML = `${g}<span class="c">${items.length}</span>`;
    frag.append(h);
    for (const e of items) {
      const row = document.createElement('div');
      row.className = 'item' + (e === current ? ' sel' : '');
      row.setAttribute('role', 'option');
      row.dataset.id = e.id;
      row.innerHTML = `<span class="tag ${e.source}">${e.source.toUpperCase()}</span><span class="n" title="${e.path}">${e.name}</span><span class="s">${sizeText(e)}</span>`;
      row.onclick = () => select(e);
      frag.append(row);
      shown.push(e);
    }
  }
  if (!shown.length) {
    const none = document.createElement('div');
    none.className = 'empty';
    none.textContent = 'Nothing matches.';
    frag.append(none);
  }
  list.replaceChildren(frag);
}

function select(e) {
  current = e;
  history.replaceState(null, '', '#' + e.id);
  for (const row of document.querySelectorAll('.item')) row.classList.toggle('sel', row.dataset.id === e.id);
  document.querySelector(`.item[data-id="${e.id}"]`)?.scrollIntoView({ block: 'nearest' });
  const info = $('info');
  info.hidden = false;
  info.innerHTML = `<h2><span class="tag ${e.source}">${e.source.toUpperCase()}</span>${e.name}</h2>
    <div class="p">${e.path}</div>
    <dl><dt>Group</dt><dd>${e.group}</dd>
    <dt>Size</dt><dd>${e.size.map((v) => v.toFixed(2)).join(' × ')} yd (W × H × D)</dd>
    <dt>Triangles</dt><dd>${e.tris.toLocaleString()}</dd></dl>`;
  show(e).catch((err) => { status.hidden = false; status.textContent = 'Could not load ' + e.name + ': ' + err; });
}

$('q').addEventListener('input', (ev) => { query = ev.target.value.trim().toLowerCase(); render(); });
addEventListener('keydown', (ev) => {
  if (ev.target.tagName === 'INPUT' || !shown.length) return;
  if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
  ev.preventDefault();
  const i = shown.indexOf(current);
  const next = shown[Math.min(shown.length - 1, Math.max(0, i + (ev.key === 'ArrowDown' ? 1 : -1)))];
  if (next) select(next);
});
$('wire').onclick = (ev) => {
  wireframe = !wireframe;
  ev.target.classList.toggle('on', wireframe);
  model?.traverse((o) => { if (o.isMesh) o.material.wireframe = wireframe; });
};
$('refs').onclick = (ev) => { refs.visible = !refs.visible; ev.target.classList.toggle('on', refs.visible); };
$('reset').onclick = frameView;

render();
status.textContent = 'Pick an object';
const first = byId.get(location.hash.slice(1)) || shown[0];
if (first) select(first);
</script>
</body>
</html>
